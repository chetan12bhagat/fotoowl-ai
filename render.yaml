services:
  - type: web
    name: fotoowl-ai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fotoowl-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: OTP_EXPIRE_MINUTES
        value: "5"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: MAX_OTP_ATTEMPTS
        value: "5"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: bhagatchetan583@gmail.com
      - key: SMTP_PASSWORD
        value: nazxphkjbqnmmasb
      - key: EMAIL_FROM
        value: FotoOwl AI <bhagatchetan583@gmail.com>
      - key: SMTP_TLS
        value: "True"

databases:
  - name: fotoowl-db
    databaseName: fotoowl
    user: fotoowl_user
    plan: free
    region: oregon
